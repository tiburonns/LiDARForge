name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lidarforge-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Validate release resources
        run: |
          plutil -lint LiDARForge/Info.plist
          plutil -lint LiDARForge/PrivacyInfo.xcprivacy
          plutil -lint LiDARForge/Resources/en.lproj/InfoPlist.strings
          plutil -lint LiDARForge/Resources/es.lproj/InfoPlist.strings
          python3 Tests/validate-release-contract.py

      - name: Build Release for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build | tee build-simulator.log

      - name: Build Release for iPhoneOS
        run: |
          set -o pipefail
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build | tee build-iphoneos.log

      - name: Static Analyze Release
        run: |
          set -o pipefail
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            analyze | tee analyze.log

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lidarforge-xcode-${{ github.run_id }}
          path: |
            build-simulator.log
            build-iphoneos.log
            analyze.log
          if-no-files-found: ignore
          retention-days: 7

name: iOS Build

permissions:
  contents: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          {
            echo "### Build diagnostics"
            echo
            echo '```text'
            grep -E "error:|warning:" build.log | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Publish build diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          diagnostic=$(grep -m1 -E "error:" build.log | sed -E 's/^[^:]+:[0-9]+:[0-9]+: error: //' | tr '\n' ' ' | cut -c1-130)
          if [ -z "$diagnostic" ]; then
            diagnostic="Xcode build failed; inspect workflow logs."
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="xcode-diagnostic" \
            -f description="$diagnostic"

      - name: Static Analyze
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}

          {
            echo "### Static-analysis diagnostics"
            echo
            echo '```text'
            grep -E "error:|warning:" analyze.log | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

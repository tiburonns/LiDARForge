name: iOS Build

permissions:
  contents: write
  statuses: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Build
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "$status" > .build_status
          exit 0

      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(cat .build_status 2>/dev/null || echo 1)
          if [ "$status" != "0" ]; then
            diagnostic=$(grep -E "error:|warning:" build.log | tail -n 40 || true)
            body=$(printf '### Xcode diagnostics\n```text\n%s\n```' "$diagnostic")
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$body" || true
          fi

      - name: Static Analyze
        shell: bash
        run: |
          status=$(cat .build_status 2>/dev/null || echo 1)
          if [ "$status" != "0" ]; then
            echo "Skipping analyze because build failed."
            echo "1" > .analyze_status
            exit 0
          fi

          set +e
          xcodebuild \
            -project LiDARForge.xcodeproj \
            -scheme LiDARForge \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee analyze.log
          analyze_status=${PIPESTATUS[0]}
          echo "$analyze_status" > .analyze_status
          exit 0

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostics-${{ github.run_id }}
          path: |
            build.log
            analyze.log
            .build_status
            .analyze_status
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          build_status=$(cat .build_status 2>/dev/null || echo 1)
          analyze_status=$(cat .analyze_status 2>/dev/null || echo 0)
          if [ "$build_status" != "0" ] || [ "$analyze_status" != "0" ]; then
            exit 1
          fi
